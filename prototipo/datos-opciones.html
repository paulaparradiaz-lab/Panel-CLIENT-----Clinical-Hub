<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis datos · opciones</title>
<link rel="icon" href="../public/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../estilos/clinical-hub.css">
<link rel="stylesheet" href="panel.css">
<style>
  .pag{max-width:1240px;margin:0 auto;padding:var(--esp-32) var(--esp-22);background:var(--bg);min-height:100vh}
  .opciones{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:var(--esp-26);margin-top:var(--esp-26)}
  @media (max-width:580px){.opciones{grid-template-columns:minmax(0,1fr)}}
  .op-nombre{margin:0 0 var(--esp-4);font-size:14px;font-weight:600;color:var(--ink)}
  .op-nota{margin:0 0 var(--esp-12);min-height:36px;font-size:12.5px;line-height:1.45;color:var(--faint)}
  .hoja{padding:var(--esp-32) var(--esp-26);border:1px solid var(--border2);border-radius:var(--r-bloque);background:var(--surface)}

  /* Piezas de esta pantalla */
  .ch-ficha dd.con-accion{display:flex;justify-content:space-between;align-items:center;gap:var(--esp-12)}
  a.accion,button.accion{display:inline-flex;align-items:center;min-height:44px;padding:0 var(--esp-4);border:0;background:none;font:inherit;font-size:13px;font-weight:500;color:var(--sel);text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  a.accion:hover,button.accion:hover{color:var(--ink)}
  .editar{display:flex;flex-wrap:wrap;gap:var(--esp-8);width:100%}
  .editar .ch-campo{flex:1 1 200px;min-height:44px}
  .botones{display:flex;gap:var(--esp-8)}
  .ch-boton.chico{padding:var(--esp-8) var(--esp-16);min-height:44px;font-size:14px}
  .soporte{margin:var(--esp-16) 0 0;font-size:13px;line-height:1.5;color:var(--faint)}
  .soporte a{font-weight:500;color:var(--ink);text-underline-offset:3px}
  .nota-correo{display:block;margin-top:2px;font-size:12.5px;line-height:1.45;color:var(--faint)}
  .nota-correo a{font-weight:500;color:var(--ink);text-underline-offset:3px}
  .guardado{font-size:13px;color:var(--ok)}
  .subtitulo{margin:var(--esp-26) 0 var(--esp-8);font-size:15.5px;font-weight:600;color:var(--ink)}
  .ch-pagina-cabeza + .subtitulo{margin-top:0}
  @media (min-width:721px){.hoja .ch-ficha > div{grid-template-columns:110px minmax(0,1fr)}}
  .ch-ficha dd.con-accion .accion{flex:none}
  .esp-bloque{display:flex;flex-wrap:wrap;align-items:flex-end;gap:var(--esp-8)}
  .esp-bloque label{flex:1 1 220px}
  .esp-bloque .ch-campo{width:100%;min-height:44px}
  .dos{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:var(--esp-26)}
  .dos .ch-ficha > div{grid-template-columns:90px minmax(0,1fr)}
  @media (max-width:820px){.dos{grid-template-columns:minmax(0,1fr)}}
  a.ch-boton{color:var(--on-sel);text-decoration:none}
  .campos{display:grid;gap:var(--esp-16);max-width:420px}
  .campos .ch-campo{width:100%;min-height:44px}
  .ch-ficha dd.con-accion > span{min-width:0;overflow-wrap:anywhere}
</style>
</head>
<body class="ch ch-panel">
<main class="pag">
  <h1 class="ch-titulo">Mis datos · opciones</h1>
  <p class="ch-bajada">Tres formas. Nombre y especialidad se cambian; el correo no, solo por WhatsApp.</p>
  <div class="opciones" id="opciones"></div>
</main>
<script>
// Marcadores: los datos reales salen de la base (perfiles).
// Nombre y especialidad: los cambia el médico (solo en la plataforma).
// Correo: no se edita; para cambiarlo, WhatsApp, y el equipo lo cambia en Hotmart y en la base.
const perfil = {nombre:'[Nombre del médico]', especialidad:'Medicina interna'};
const correo = '[correo]';
const whatsapp = 'https://wa.me/573004067138?text=' + encodeURIComponent(
  `Hola, equipo de Clinical Hub. Quiero cambiar el correo de mi cuenta; el actual es ${correo}. ¿Me ayudan, por favor?`);
const fila = (dt, dd, clase = '') => `<div><dt>${dt}</dt><dd${clase ? ` class="${clase}"` : ''}>${dd}</dd></div>`;
const cabeza = `<div class="ch-pagina-cabeza"><h2 class="ch-titulo">Mis datos</h2><p class="ch-bajada">Tu nombre y tu especialidad, como se ven en Clinical Hub.</p></div>`;
const aviso = `El cambio de correo solo se puede realizar vía <a href="${whatsapp}" target="_blank" rel="noopener">WhatsApp</a>.`;
const filaCorreo = `<div><dt>Correo de ingreso</dt><dd>${correo}<span class="nota-correo">${aviso}</span></dd></div>`;
const soporteCorreo = `<p class="soporte">${aviso}</p>`;
const editando = {};
const editable = (op, campo, rotulo) => editando[op] === campo
  ? fila(rotulo, `<div class="editar"><input class="ch-campo" aria-label="${rotulo}" value="${perfil[campo]}" data-campo="${op}">
      <span class="botones"><button type="button" class="ch-boton chico" data-guardar="${op}" data-que="${campo}">Guardar</button>
      <button type="button" class="ch-boton secundario chico" data-cancelar="${op}">Cancelar</button></span></div>`)
  : fila(rotulo, `<span>${perfil[campo]}</span><button type="button" class="accion" data-cambiar="${op}" data-que="${campo}">Cambiar</button>`, 'con-accion');
const campos = op => `<div class="campos">
  <label><span class="ch-rotulo">Nombre</span><input class="ch-campo" value="${perfil.nombre}" data-campo-nombre="${op}"></label>
  <label><span class="ch-rotulo">Especialidad</span><input class="ch-campo" value="${perfil.especialidad}" data-campo-especialidad="${op}"></label>
  <div><button type="button" class="ch-boton chico" data-guardar-ambos="${op}">Guardar</button></div></div>`;

const opciones = [
  ['1 · Una sola ficha', 'Todo en la misma ficha. Nombre y especialidad tienen «Cambiar» y se editan en su fila. Bajo el correo, que el cambio solo se hace vía WhatsApp.',
   op => `${cabeza}<dl class="ch-ficha">${editable(op, 'nombre', 'Nombre')}${filaCorreo}${editable(op, 'especialidad', 'Especialidad')}</dl>`],
  ['2 · Perfil e ingreso', 'Arriba, tu perfil: lo que puedes cambiar. Abajo, el correo de ingreso y la línea de que el cambio solo se hace vía WhatsApp.',
   op => `${cabeza}<p class="subtitulo">Tu perfil</p><dl class="ch-ficha">${editable(op, 'nombre', 'Nombre')}${editable(op, 'especialidad', 'Especialidad')}</dl>
     <p class="subtitulo">Tu ingreso</p><dl class="ch-ficha">${fila('Correo de ingreso', correo)}</dl>${soporteCorreo}`],
  ['3 · Formulario corto', 'Nombre y especialidad como campos siempre abiertos, con un solo «Guardar». Debajo, el correo de ingreso, que solo se lee.',
   op => `${cabeza}${campos(op)}
     <p class="subtitulo">Tu ingreso</p><dl class="ch-ficha">${fila('Correo de ingreso', correo)}</dl>${soporteCorreo}`],
];

const pintar = (op, aviso) => {
  document.querySelector(`[data-op="${op}"]`).innerHTML = opciones[op][2](op) + (aviso ? `<p class="guardado" role="status">${aviso}</p>` : '');
};
document.getElementById('opciones').innerHTML = opciones.map(([n, nota], i) =>
  `<section><p class="op-nombre">${n}</p><p class="op-nota">${nota}</p><div class="hoja" data-op="${i}"></div></section>`).join('');
opciones.forEach((_, i) => pintar(i));

document.getElementById('opciones').addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  const op = b.dataset.cambiar || b.dataset.cancelar || b.dataset.guardar || b.dataset.guardarAmbos;
  if (b.dataset.cambiar) { editando[op] = b.dataset.que; pintar(+op); document.querySelector(`[data-campo="${op}"]`).focus(); }
  if (b.dataset.cancelar) { editando[op] = null; pintar(+op); }
  if (b.dataset.guardar) {
    const valor = document.querySelector(`[data-campo="${op}"]`).value.trim(); if (!valor) return;
    perfil[b.dataset.que] = valor; editando[op] = null;
    pintar(+op, b.dataset.que === 'nombre' ? 'Guardamos tu nombre.' : 'Guardamos tu especialidad.');
  }
  if (b.dataset.guardarAmbos) {
    const n = document.querySelector(`[data-campo-nombre="${op}"]`).value.trim(), e = document.querySelector(`[data-campo-especialidad="${op}"]`).value.trim();
    if (!n || !e) return;
    perfil.nombre = n; perfil.especialidad = e; pintar(+op, 'Guardamos tus datos.');
  }
});
</script>
</body>
</html>
