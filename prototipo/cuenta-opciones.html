<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuenta · opciones</title>
<link rel="stylesheet" href="../estilos/clinical-hub.css">
<link rel="stylesheet" href="panel.css">
<style>
  .ch-opciones-pagina{max-width:1240px;margin:0 auto;padding:var(--esp-32) var(--esp-22);background:var(--surface)}
  .ch-comparar{display:flex;align-items:center;gap:var(--esp-16);margin-top:var(--esp-16)}
  .ch-lenta{display:inline-flex;align-items:center;gap:var(--esp-8);font-size:14px;color:var(--muted);cursor:pointer}
  .ch-lenta input{width:18px;height:18px;accent-color:var(--sel)}
  .ch-opciones{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--esp-26);margin-top:var(--esp-26)}
  .ch-opcion-nombre{margin:0 0 var(--esp-4);font-size:14px;font-weight:600;color:var(--ink)}
  .ch-opcion-nota{margin:0 0 var(--esp-12);min-height:36px;font-size:12.5px;line-height:1.4;color:var(--faint)}
  /* Una cabecera en miniatura con espacio para que el menú se abra */
  .ch-escena{position:relative;height:380px;padding:var(--esp-16);border:1px solid var(--border);border-radius:var(--r-bloque);background:var(--bg)}
  .ch-escena .ch-cuenta{position:absolute;top:var(--esp-16);right:var(--esp-16)}
  .ch-escena .ch-cuenta-menu{animation:none}

  /* Cada opción: la animación al abrir */
  .op-hoy .ch-cuenta-menu:not([hidden]){animation:ch-pop .35s var(--ease)}
  .op-fundido .ch-cuenta-menu:not([hidden]){animation:c-fundido .18s ease-out}
  .op-baja .ch-cuenta-menu:not([hidden]){animation:c-baja .22s ease-out}
  .op-crece .ch-cuenta-menu:not([hidden]){animation:c-crece .2s ease-out}
  .op-marca .ch-cuenta-menu:not([hidden]){animation:c-marca .4s var(--ease)}
  .op-cortina .ch-cuenta-menu:not([hidden]){animation:c-cortina .3s ease-out}
  .op-esquina .ch-cuenta-menu:not([hidden]){animation:c-esquina .35s ease-out}
  .op-lado .ch-cuenta-menu:not([hidden]){animation:c-lado .22s ease-out}
  .op-ancla .ch-cuenta-menu:not([hidden]){animation:c-ancla .3s var(--ease)}
  .op-instante .ch-cuenta-menu:not([hidden]){animation:none}

  @keyframes c-fundido{from{opacity:0}to{opacity:1}}
  @keyframes c-baja{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
  @keyframes c-crece{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  @keyframes c-marca{from{opacity:0;transform:scale(.92) translateY(-4px)}to{opacity:1;transform:none}}
  @keyframes c-cortina{from{clip-path:inset(0 0 100% 0 round var(--r-menu))}to{clip-path:inset(0 0 0 0 round var(--r-menu))}}
  @keyframes c-esquina{from{clip-path:circle(0 at 100% 0)}to{clip-path:circle(150% at 100% 0)}}
  @keyframes c-lado{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
  @keyframes c-ancla{from{opacity:0;transform:scaleY(.6)}to{opacity:1;transform:none}}
</style>
</head>
<body class="ch">
<main class="ch-opciones-pagina">
  <h1 class="ch-titulo">Cuenta · cómo se abre el menú</h1>
  <p class="ch-bajada">Haz clic en el botón de la cuenta de cada opción · con cámara lenta se notan mejor las diferencias.</p>
  <div class="ch-comparar">
    <button type="button" class="ch-boton secundario" id="todas">Abrir o cerrar todas</button>
    <label class="ch-lenta"><input type="checkbox" id="lenta"> Cámara lenta</label>
  </div>
  <div class="ch-opciones" id="opciones"></div>
</main>

<svg class="ch-sprite" aria-hidden="true">
  <symbol id="i-cuenta" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></symbol>
</svg>

<script>
const opciones = [
  ['op-hoy', '1 · Hoy: salto', 'Crece desde muy pequeño, se pasa y rebota. Es el salto de las ventanas grandes.'],
  ['op-fundido', '2 · Aparecer', 'Solo pasa de transparente a visible, muy rápido. Lo más tranquilo.'],
  ['op-baja', '3 · Bajar y aparecer', 'Aparece mientras baja unos pocos píxeles desde el botón.'],
  ['op-crece', '4 · Crecer suave', 'Crece apenas desde la esquina del botón, sin rebote.'],
  ['op-marca', '5 · Con la curva de la marca', 'Crece y baja un poco con --ease: un rebote mínimo, no un salto.'],
  ['op-cortina', '6 · Cortina', 'Se descubre de arriba hacia abajo, como se abre Guías en el menú.'],
  ['op-esquina', '7 · Desde la esquina', 'Se revela en círculo desde la esquina del botón.'],
  ['op-lado', '8 · Desde el lado', 'Aparece corriéndose unos píxeles desde la derecha.'],
  ['op-ancla', '9 · Desplegar', 'Se estira hacia abajo desde su borde de arriba, con la curva de la marca.'],
  ['op-instante', '10 · Al instante', 'Sin movimiento: aparece de una vez.'],
];
const menuCuenta = `
  <div class="ch-cuenta-datos">
    <p class="ch-cuenta-nombre">[Nombre del médico]</p>
    <p class="ch-mini">[Correo] · [Especialidad]</p>
  </div>
  <a class="ch-cuenta-item" href="#">Mis datos</a>
  <a class="ch-cuenta-item" href="#">Suscripción<span class="ch-mini">[Plan] · activa hasta [fecha]</span></a>
  <a class="ch-cuenta-item" href="#">Ayuda o contacto</a>
  <button type="button" class="ch-cuenta-item ch-cuenta-salir">Cerrar sesión</button>`;
document.getElementById('opciones').innerHTML = opciones.map(([clase, nombre, nota]) => `
  <section class="ch-opcion ${clase}">
    <p class="ch-opcion-nombre">${nombre}</p>
    <p class="ch-opcion-nota">${nota}</p>
    <div class="ch-escena">
      <div class="ch-cuenta">
        <button type="button" class="ch-boton-redondo" aria-label="Mi cuenta" aria-expanded="false"><svg aria-hidden="true"><use href="#i-cuenta"/></svg></button>
        <div class="ch-cuenta-menu" hidden>${menuCuenta}</div>
      </div>
    </div>
  </section>`).join('');

const lenta = document.getElementById('lenta');
const alternar = cuenta => {
  const menu = cuenta.querySelector('.ch-cuenta-menu');
  menu.hidden = !menu.hidden;
  cuenta.querySelector('button').setAttribute('aria-expanded', !menu.hidden);
  if (lenta.checked) requestAnimationFrame(() => menu.getAnimations().forEach(a => a.playbackRate = 1/3));
};
document.querySelectorAll('.ch-escena .ch-cuenta').forEach(c =>
  c.querySelector('.ch-boton-redondo').addEventListener('click', () => alternar(c)));
document.querySelectorAll('.ch-cuenta-menu a').forEach(a => a.addEventListener('click', e => e.preventDefault()));
document.getElementById('todas').addEventListener('click', () =>
  document.querySelectorAll('.ch-escena .ch-cuenta').forEach(alternar));
</script>
</body>
</html>
