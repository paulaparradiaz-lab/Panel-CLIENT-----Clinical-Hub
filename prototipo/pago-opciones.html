<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recordatorio de pago · opciones</title>
<link rel="icon" href="../public/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../estilos/clinical-hub.css">
<style>
  .pag{max-width:1240px;margin:0 auto;padding:var(--esp-32) var(--esp-22);background:var(--bg);min-height:100vh}
  .op{margin-top:var(--esp-32)}
  .op-nombre{margin:0 0 var(--esp-4);font-size:14px;font-weight:600;color:var(--ink)}
  .op-nota{margin:0 0 var(--esp-12);max-width:760px;font-size:12.5px;line-height:1.45;color:var(--faint)}
  .par{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:var(--esp-22);align-items:start}
  @media (max-width:900px){.par{grid-template-columns:minmax(0,1fr)}}
  .rotulo-disp{margin:0 0 var(--esp-6);font-size:12.5px;color:var(--faint)}

  /* Panel en miniatura: cabecera blanca, menú verde, contenido */
  .mini{position:relative;display:grid;grid-template-rows:auto minmax(0,1fr);height:460px;overflow:hidden;border:1px solid var(--border2);border-radius:var(--r-bloque);background:var(--surface)}
  .mini-cab{display:flex;align-items:center;gap:var(--esp-12);height:60px;padding:0 var(--esp-16)}
  .mini-logo{margin-right:auto;white-space:nowrap;font-size:19px;font-weight:800;letter-spacing:-.035em;color:var(--side)}
  .mini-logo span{color:var(--hub-verde)}
  .mini-cuerpo{display:grid;grid-template-columns:180px minmax(0,1fr);min-height:0}
  .mini-menu{display:flex;flex-direction:column;gap:var(--esp-4);padding:var(--esp-16) var(--esp-8) var(--esp-8);background:var(--side);color:var(--side-faint);border-top-right-radius:calc(var(--r) * 2)}
  .mini-item{padding:var(--esp-8) var(--esp-12);border-radius:var(--r-item);font-size:12.5px;font-weight:500}
  .mini-item.actual{background:var(--brand);color:var(--brand-ink)}
  .mini-cuenta{position:relative;margin-top:auto;padding:var(--esp-8) var(--esp-12);border-top:1px solid var(--side-hover);font-size:12.5px;font-weight:500;line-height:1.3;color:var(--side-ink)}
  .mini-cuenta small{display:block;font-size:11.5px;font-weight:400;color:var(--side-faint)}
  .mini-contenido{min-width:0;overflow:hidden}
  .mini-pagina{padding:var(--esp-20) var(--esp-22)}
  .mini-titulo{margin:0;font-size:22px;font-weight:400;letter-spacing:-.02em;color:var(--ink)}
  .mini-bajada{margin:var(--esp-4) 0 var(--esp-16);font-size:13px;color:var(--faint)}
  .mini-fila{height:44px;border-bottom:1px solid var(--border);display:flex;align-items:center;font-size:13px;color:var(--muted)}
  .mini-redondo{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--surface2);border:1px solid var(--border)}
  .mini-redondo svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round}

  /* Celular */
  .celu .mini{height:560px;grid-template-rows:auto minmax(0,1fr)}
  .celu .mini-cuerpo{grid-template-columns:minmax(0,1fr)}
  .celu .mini-menu{display:none}
  .celu .mini-pagina{padding:var(--esp-16)}
  /* Menú abierto en celular: hoja desde abajo */
  .celu .hoja{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;gap:var(--esp-4);padding:var(--esp-16) var(--esp-12) var(--esp-12);background:var(--side);color:var(--side-faint);border-radius:var(--r) var(--r) 0 0}
  .celu .velo{position:absolute;inset:0;background:var(--border2)}

  /* ---- Los avisos ---- */
  .pago-enlace{font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;white-space:nowrap}
  .pago-enlace:focus-visible{outline:2px solid var(--sel);outline-offset:2px;border-radius:4px}

  /* 1 · Franja bajo la cabecera, a lo ancho del contenido */
  .a-franja{display:flex;flex-wrap:wrap;align-items:center;gap:var(--esp-4) var(--esp-12);padding:var(--esp-8) var(--esp-22);background:var(--nota-amarilla);border-bottom:1px solid var(--border);font-size:13px;line-height:1.45;color:var(--ink)}
  .celu .a-franja{padding:var(--esp-8) var(--esp-16)}

  /* 2 · Nota al inicio de Mis favoritos, antes del título */
  .a-nota{display:flex;flex-wrap:wrap;align-items:baseline;gap:var(--esp-4) var(--esp-12);margin-bottom:var(--esp-16);padding:var(--esp-12) var(--esp-16);border-radius:var(--r-sm);background:var(--nota-amarilla);font-size:13px;line-height:1.45;color:var(--ink)}

  /* 3 · En la cuenta del menú */
  .a-punto{display:inline-block;width:8px;height:8px;margin-right:var(--esp-6);border-radius:50%;background:var(--nota-amarilla);vertical-align:1px}
  .a-cuenta-detalle{color:var(--nota-amarilla)}
  .mini-redondo{position:relative}
  .a-punto-boton{position:absolute;top:4px;right:4px;width:9px;height:9px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--surface)}
  .hoja .a-suscripcion{padding:var(--esp-8) var(--esp-12);border-radius:var(--r-item);background:var(--side-hover);font-size:12.5px;font-weight:500;line-height:1.35;color:var(--side-ink)}
  .hoja .a-suscripcion small{display:block;font-weight:400;color:var(--nota-amarilla)}

  /* 4 · Pastilla en la cabecera */
  .a-pastilla{display:inline-flex;align-items:center;gap:var(--esp-8);min-height:36px;padding:0 var(--esp-12) 0 var(--esp-16);border-radius:var(--r-pill);background:var(--nota-amarilla);border:1px solid var(--border2);font-size:12.5px;font-weight:500;color:var(--ink);text-decoration:none;white-space:nowrap}
  .celu .a-pastilla{padding:0 var(--esp-12)}
  .a-pastilla b{font-weight:600;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body class="ch">
<main class="pag">
  <h1 class="ch-titulo">Recordatorio de pago · opciones</h1>
  <p class="ch-bajada">Lo ve solo el médico con el pago atrasado, que sigue con acceso. Cada opción en computador y en celular.</p>
  <div id="opciones"></div>
</main>

<svg width="0" height="0" aria-hidden="true">
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
</svg>

<script>
// Textos del aviso. El enlace va a la página de Hotmart donde el médico cambia la
// tarjeta: [ENLACE DE HOTMART] hasta confirmar cuál es.
const largo = `<span>Hotmart no pudo cobrar tu suscripción. Volverá a intentarlo; revisa tu medio de pago para no perder el acceso.</span><a class="pago-enlace" href="#">Revisar mi pago</a>`;
const corto = `<span>Hotmart no pudo cobrar tu suscripción.</span><a class="pago-enlace" href="#">Revisar mi pago</a>`;

const items = ['Mis favoritos', 'Nuevo', 'Guías de práctica clínica', 'Clinical News', 'Autoevaluación', 'Entrenamiento en IA'];
const menu = cuenta => `<nav class="mini-menu">${items.map((t, i) => `<span class="mini-item${i === 0 ? ' actual' : ''}">${t}</span>`).join('')}
  <div class="mini-cuenta">${cuenta}</div></nav>`;
const cuentaNormal = `Paula Parra<small>[Especialidad]</small>`;
const filas = n => Array.from({length: n}, () => `<div class="mini-fila">[Título de la guía]</div>`).join('');
const pagina = (antes = '') => `<div class="mini-pagina">${antes}<h2 class="mini-titulo">Mis favoritos</h2><p class="mini-bajada">[Bajada de la sección]</p>${filas(6)}</div>`;
const botonMenu = (punto = '') => `<span class="mini-redondo"><svg><use href="#i-menu"/></svg>${punto}</span>`;

const compu = ({cab = '', franja = '', antes = '', cuenta = cuentaNormal}) => `<div class="mini">
  <div class="mini-cab"><span class="mini-logo">Clinical <span>hub</span></span>${cab}</div>
  <div class="mini-cuerpo">${menu(cuenta)}<div class="mini-contenido">${franja}${pagina(antes)}</div></div></div>`;
const celu = ({cab = '', franja = '', antes = '', punto = '', hoja = ''}) => `<div class="mini">
  <div class="mini-cab"><span class="mini-logo">Clinical <span>hub</span></span>${cab}${botonMenu(punto)}</div>
  <div class="mini-cuerpo"><div class="mini-contenido">${franja}${pagina(antes)}</div></div>${hoja}</div>`;

const hojaCuenta = `<div class="velo"></div><div class="hoja">
  <span class="mini-item">Mis datos</span>
  <div class="a-suscripcion">Suscripción<small><span class="a-punto"></span>Pago pendiente · revisar mi pago</small></div>
  <span class="mini-item">Información editorial</span>
  <span class="mini-item">Ayuda o contacto</span>
  <div class="mini-cuenta">Paula Parra<small><span class="a-punto"></span>Pago pendiente</small></div></div>`;

const opciones = [
  ['1 · Franja bajo la cabecera',
   'Una línea amarilla a lo ancho del contenido, en todas las páginas, hasta que el pago entre. Es la que más se ve sin tapar nada.',
   {franja: `<div class="a-franja">${largo}</div>`}, {franja: `<div class="a-franja">${corto}</div>`}],
  ['2 · Nota al entrar',
   'Una nota amarilla antes del título, solo en Mis favoritos (la página con la que se entra). En el resto del panel no aparece.',
   {antes: `<div class="a-nota">${largo}</div>`}, {antes: `<div class="a-nota">${corto}</div>`}],
  ['3 · En la cuenta',
   'Lo más discreto: bajo el nombre, «Pago pendiente» en vez de la especialidad, y en Suscripción el enlace para pagar. En celular, un punto en el botón del menú avisa; aquí se ve con el menú abierto.',
   {cuenta: `Paula Parra<small class="a-cuenta-detalle"><span class="a-punto"></span>Pago pendiente</small>`},
   {punto: `<span class="a-punto-boton"></span>`, hoja: hojaCuenta}],
  ['4 · Pastilla en la cabecera',
   'Una pastilla amarilla arriba a la derecha, en todas las páginas: corta y siempre a la vista, al lado de la marca.',
   {cab: `<a class="a-pastilla" href="#">Pago pendiente <b>Revisar</b></a>`},
   {cab: `<a class="a-pastilla" href="#">Pago pendiente</a>`}],
  ['5 · Nota al entrar + cuenta',
   'La 2 y la 3 juntas: la nota amarilla al entrar para que la vea, y «Pago pendiente» en la cuenta para que lo tenga a mano mientras navega.',
   {antes: `<div class="a-nota">${largo}</div>`, cuenta: `Paula Parra<small class="a-cuenta-detalle"><span class="a-punto"></span>Pago pendiente</small>`},
   {antes: `<div class="a-nota">${corto}</div>`, punto: `<span class="a-punto-boton"></span>`}],
];

document.getElementById('opciones').innerHTML = opciones.map(([nombre, nota, c, m]) => `<section class="op">
  <p class="op-nombre">${nombre}</p><p class="op-nota">${nota}</p>
  <div class="par"><div><p class="rotulo-disp">Computador</p>${compu(c)}</div>
  <div class="celu"><p class="rotulo-disp">Celular</p>${celu(m)}</div></div></section>`).join('');
</script>
</body>
</html>
