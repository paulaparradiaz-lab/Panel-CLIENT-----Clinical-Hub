<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Despliegue · opciones</title>
<link rel="stylesheet" href="../estilos/clinical-hub.css">
<link rel="stylesheet" href="panel.css">
<style>
  /* Curva suave usada solo para comparar en esta hoja */
  :root{--ease-suave:cubic-bezier(.22,.61,.36,1)}
  .ch-opciones-pagina{max-width:1240px;margin:0 auto;padding:var(--esp-32) var(--esp-22);background:var(--surface)}
  .ch-opciones{display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--esp-32);margin-top:var(--esp-26)}
  .ch-opcion-nombre{margin:0 0 var(--esp-8);font-size:14px;font-weight:600;color:var(--ink)}
  .ch-opcion-nota{margin:0 0 var(--esp-12);max-width:280px;min-height:52px;font-size:12.5px;line-height:1.4;color:var(--faint)}

  /* El menú real, quieto, con botones que se pueden usar */
  .ch-opcion .ch-menu{display:block;position:static;height:auto;margin:0;overflow:visible}
  .ch-opcion button.ch-menu-item{width:100%;border:0;background:none;text-align:left;font:inherit;font-size:14px;font-weight:500;color:var(--side-faint);cursor:pointer}
  .ch-opcion button.ch-menu-item.sub{font-size:13.5px;font-weight:400}
  .ch-opcion button.ch-menu-item:hover{color:var(--side-ink);background:var(--side-hover)}
  .ch-opcion button.ch-menu-item[aria-current="page"]{color:var(--brand-ink);background:var(--brand)}

  .ch-comparar{display:flex;align-items:center;gap:var(--esp-16);margin-top:var(--esp-16)}
  .ch-lenta{display:inline-flex;align-items:center;gap:var(--esp-8);font-size:14px;color:var(--muted);cursor:pointer}
  .ch-lenta input{width:18px;height:18px;accent-color:var(--sel)}

  /* 1 · Deslizar (hoy): el alto de la rama pasa de 0 a su tamaño; viene de panel.css */

  /* 2 · Deslizar y aparecer: además del alto, las secciones pasan de transparentes a visibles */
  .op-fundido .ch-menu-rama > li{opacity:0;transition:opacity .25s}
  .op-fundido .ch-menu-grupo.abierto > .ch-menu-rama > li{opacity:1;transition:opacity .3s .1s}

  /* 3 · Con la curva de la marca: el despliegue usa --ease, con su pequeño rebote */
  .op-rebote .ch-menu-grupo{transition:grid-template-rows .5s var(--ease)}
  .op-rebote .ch-menu-item .ch-menu-flecha{transition:transform .5s var(--ease)}

  /* 4 · Persiana: cada sección baja desde su borde de arriba mientras la rama se abre */
  .op-persiana .ch-menu-rama > li{transform:scaleY(.4);transform-origin:top;opacity:0;transition:transform .3s var(--ease-suave),opacity .2s}
  .op-persiana .ch-menu-grupo.abierto > .ch-menu-rama > li{transform:none;opacity:1}

  /* 5 · Revelado: la rama se descubre de arriba hacia abajo, como si corriera una cortina */
  .op-revelado .ch-menu-rama{clip-path:inset(0 0 100% 0);transition:clip-path .35s var(--ease-suave),visibility .35s}
  .op-revelado .ch-menu-grupo.abierto > .ch-menu-rama{clip-path:inset(0)}

  /* 6 · Uno tras otro: cada sección aparece un instante después de la anterior */
  .op-cascada .ch-menu-rama > li{opacity:0;transform:translateY(-4px);transition:opacity .2s,transform .2s}
  .op-cascada .ch-menu-grupo.abierto > .ch-menu-rama > li{opacity:1;transform:none;transition:opacity .25s calc(var(--i) * 45ms),transform .25s calc(var(--i) * 45ms)}

  /* 7 · Al instante: la rama aparece sin movimiento; solo gira la flecha */
  .op-instante .ch-menu-grupo,
  .op-instante .ch-menu-rama{transition:none}
</style>
</head>
<body class="ch">
<main class="ch-opciones-pagina">
  <h1 class="ch-titulo">Menú · cómo se abre «Guías de práctica clínica»</h1>
  <p class="ch-bajada">Haz clic en «Guías de práctica clínica» para abrirla y otra vez para cerrarla.</p>
  <div class="ch-comparar">
    <button type="button" class="ch-boton secundario" id="todas">Abrir o cerrar todas</button>
    <label class="ch-lenta"><input type="checkbox" id="lenta"> Cámara lenta</label>
  </div>
  <div class="ch-opciones" id="opciones"></div>
</main>

<svg class="ch-sprite" aria-hidden="true">
  <symbol id="i-estrella" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></symbol>
  <symbol id="i-nuevo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></symbol>
  <symbol id="i-guias" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h13"/><path d="M9 7h6"/></symbol>
  <symbol id="i-news" viewBox="0 0 24 24"><path d="M16 6h3a1 1 0 0 1 1 1v11a2 2 0 0 1-4 0V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a3 3 0 0 0 3 3h11"/><path d="M8 8h4M8 12h4M8 16h4"/></symbol>
  <symbol id="i-autoevaluacion" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"/></symbol>
  <symbol id="i-ia" viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 7V4M9.5 12h.01M14.5 12h.01M10 15h4M3 11v3M21 11v3"/></symbol>
  <symbol id="i-flecha" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
</svg>

<script>
const opciones = [
  ['op-hoy', '1 · Deslizar (hoy)', 'La rama crece hacia abajo en 0,35 s y frena suave.'],
  ['op-fundido', '2 · Deslizar y aparecer', 'Crece igual, y las secciones aparecen de transparentes a visibles.'],
  ['op-rebote', '3 · Con la curva de la marca', 'Crece con la curva de los botones: pasa un poquito y se acomoda.'],
  ['op-persiana', '4 · Persiana', 'Cada sección baja desde su borde de arriba, como una persiana.'],
  ['op-revelado', '5 · Revelado', 'La rama se descubre de arriba hacia abajo, como una cortina que corre.'],
  ['op-cascada', '6 · Uno tras otro', 'Las secciones aparecen una después de otra, con un instante de diferencia.'],
  ['op-instante', '7 · Al instante', 'Sin movimiento: la rama aparece de una vez y solo gira la flecha.'],
];
const flecha = '<svg class="ch-menu-flecha" aria-hidden="true"><use href="#i-flecha"/></svg>';
const arbol = [
  {id:'favoritos', nombre:'Mis favoritos', icono:'i-estrella'},
  {id:'nuevo', nombre:'Nuevo', icono:'i-nuevo'},
  {id:'guias', nombre:'Guías de práctica clínica', icono:'i-guias', hijos:[
    {id:'resumenes', nombre:'Resúmenes individuales'},
    {id:'contrastadas', nombre:'Guías contrastadas'},
    {id:'herramientas', nombre:'Herramientas interactivas'},
    {id:'videos', nombre:'Videos de procedimientos'},
  ]},
  {id:'news', nombre:'Clinical News', icono:'i-news'},
  {id:'autoevaluacion', nombre:'Autoevaluación', icono:'i-autoevaluacion'},
  {id:'ia', nombre:'Entrenamiento en IA', icono:'i-ia'},
];
const items = (lista, nivel) => lista.map((s, i) => `
  <li${s.hijos ? ' class="ch-menu-grupo"' : ''} data-i="${i}">
    <button type="button" class="ch-menu-item${nivel ? ' sub' : ''}" data-id="${s.id}"${s.hijos ? ' aria-expanded="false"' : ''}>${s.icono ? `<svg aria-hidden="true"><use href="#${s.icono}"/></svg>` : ''}<span class="ch-menu-nombre">${s.nombre}</span>${s.hijos ? flecha : ''}</button>
    ${s.hijos ? `<ul class="ch-menu-rama">${items(s.hijos, nivel + 1)}</ul>` : ''}
  </li>`).join('');

document.getElementById('opciones').innerHTML = opciones.map(([clase, nombre, nota]) => `
  <section class="ch-opcion ${clase}">
    <p class="ch-opcion-nombre">${nombre}</p>
    <p class="ch-opcion-nota">${nota}</p>
    <nav class="ch-menu" aria-label="${nombre}"><ul class="ch-menu-lista">${items(arbol, 0)}</ul></nav>
  </section>`).join('');

// Orden de cada sección dentro de su rama, para la opción «Uno tras otro»
document.querySelectorAll('[data-i]').forEach(li => li.style.setProperty('--i', li.dataset.i));

// Igual que el panel: clic en un grupo cerrado lo abre y lo elige;
// clic en un grupo abierto lo cierra sin cambiar de sección.
document.querySelectorAll('.ch-opcion .ch-menu').forEach(nav => {
  const cerrados = new Set();
  const abrir = () => {
    const actual = nav.querySelector('[aria-current]');
    nav.querySelectorAll('.ch-menu-grupo').forEach(g => {
      const b = g.querySelector(':scope > button');
      const abierta = g.contains(actual) && !cerrados.has(b.dataset.id);
      g.classList.toggle('abierto', abierta);
      b.setAttribute('aria-expanded', abierta);
    });
  };
  const elegir = id => {
    cerrados.clear();
    nav.querySelectorAll('.ch-menu-item').forEach(b => b.dataset.id === id ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
    abrir();
  };
  nav.addEventListener('click', e => {
    const b = e.target.closest('.ch-menu-item');
    if (!b) return;
    const grupo = b.parentElement.classList.contains('ch-menu-grupo');
    if (grupo && b.getAttribute('aria-expanded') === 'true') { cerrados.add(b.dataset.id); abrir(); }
    else if (grupo && b.hasAttribute('aria-current')) { cerrados.delete(b.dataset.id); abrir(); }
    else elegir(b.dataset.id);
  });
  elegir('nuevo');
});

// Cámara lenta: las animaciones que arrancan tras un clic corren a un tercio de velocidad.
const lenta = document.getElementById('lenta');
document.addEventListener('click', () => requestAnimationFrame(() =>
  document.getAnimations().forEach(a => a.playbackRate = lenta.checked ? 1/3 : 1)));

// Abrir o cerrar todas a la vez, para compararlas lado a lado.
document.getElementById('todas').addEventListener('click', () =>
  document.querySelectorAll('.ch-opcion .ch-menu [data-id="guias"]').forEach(b => b.click()));
</script>
</body>
</html>
