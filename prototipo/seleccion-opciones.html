<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selección · opciones</title>
<link rel="stylesheet" href="../estilos/clinical-hub.css">
<link rel="stylesheet" href="panel.css">
<style>
  /* Curva suave usada solo para comparar en esta hoja */
  :root{--ease-suave:cubic-bezier(.22,.61,.36,1)}
  .ch-opciones-pagina{max-width:1240px;margin:0 auto;padding:var(--esp-32) var(--esp-22);background:var(--surface)}
  .ch-opciones{display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--esp-32);margin-top:var(--esp-26)}
  .ch-opcion-nombre{margin:0 0 var(--esp-8);font-size:14px;font-weight:600;color:var(--ink)}
  .ch-opcion-nota{margin:0 0 var(--esp-12);max-width:280px;font-size:12.5px;line-height:1.4;color:var(--faint)}

  /* El menú real, quieto, con botones que se pueden usar */
  .ch-opcion .ch-menu{display:block;position:static;height:auto;margin:0;overflow:visible}
  .ch-opcion button.ch-menu-item{width:100%;border:0;background:none;text-align:left;font:inherit;font-size:14px;font-weight:500;color:var(--side-faint);cursor:pointer}
  .ch-opcion button.ch-menu-item.sub{font-size:13.5px;font-weight:400}
  .ch-opcion button.ch-menu-item:hover{color:var(--side-ink);background:var(--side-hover)}
  .ch-opcion button.ch-menu-item{transition:color .3s,background .3s,box-shadow .3s,border-color .3s}

  /* Todas parten del lima lleno de hoy */
  .ch-opcion button.ch-menu-item[aria-current="page"]{color:var(--brand-ink);background:var(--brand)}

  /* 2 · Ajustada al texto: la píldora solo abraza el nombre, no todo el ancho */
  .op-ajustada button.ch-menu-item{width:auto;max-width:100%}

  /* 3 · Rectángulo suave: en vez de píldora, el redondeo de las filas de menú del manual */
  .op-rect button.ch-menu-item{border-radius:var(--r-item)}

  /* 4 · Anillo interior: el lima con una línea verde oscura por dentro, como un sello */
  .op-anillo button.ch-menu-item[aria-current="page"]{box-shadow:inset 0 0 0 1.5px var(--brand-ink)}

  /* 5 · Foco: lo elegido en lima y lo demás un poco más apagado mientras no pasas el mouse */
  .op-foco .ch-menu:not(:hover) button.ch-menu-item:not([aria-current]){opacity:.6}
  .op-foco button.ch-menu-item{transition:color .3s,background .3s,opacity .3s}

  /* 6 · Se desliza: la píldora viaja de la sección anterior a la nueva */
  .op-desliza .ch-menu-lista{position:relative}
  .op-desliza .ch-menu-lista > li{position:relative;z-index:1}
  .op-desliza button.ch-menu-item[aria-current="page"]{background:none}
  .op-desliza .ch-desliza{
    position:absolute; left:0; top:var(--y,0); width:var(--w,0); height:var(--h,0);
    border-radius:var(--r-pill); background:var(--brand); pointer-events:none;
  }
  .op-desliza .ch-desliza.lista{transition:top .35s var(--ease-suave),width .35s var(--ease-suave),height .35s var(--ease-suave)}
</style>
</head>
<body class="ch">
<main class="ch-opciones-pagina">
  <h1 class="ch-titulo">Menú · variaciones del lima</h1>
  <p class="ch-bajada">Haz clic en las secciones · abre «Guías de práctica clínica» para ver también las de adentro.</p>
  <div class="ch-opciones" id="opciones"></div>
</main>

<svg class="ch-sprite" aria-hidden="true">
  <symbol id="i-estrella" viewBox="0 0 24 24"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></symbol>
  <symbol id="i-nuevo" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></symbol>
  <symbol id="i-guias" viewBox="0 0 24 24"><path d="M4 19V5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h13"/><path d="M9 7h6"/></symbol>
  <symbol id="i-news" viewBox="0 0 24 24"><path d="M16 6h3a1 1 0 0 1 1 1v11a2 2 0 0 1-4 0V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a3 3 0 0 0 3 3h11"/><path d="M8 8h4M8 12h4M8 16h4"/></symbol>
  <symbol id="i-autoevaluacion" viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 11l2 2 4-4M9 17h6"/></symbol>
  <symbol id="i-ia" viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="11" rx="3"/><path d="M12 7V4M9.5 12h.01M14.5 12h.01M10 15h4M3 11v3M21 11v3"/></symbol>
  <symbol id="i-flecha" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
</svg>

<script>
const opciones = [
  ['op-hoy', '1 · Hoy', 'Lima lleno de borde a borde.'],
  ['op-ajustada', '2 · Ajustada al texto', 'La píldora solo abraza el nombre y deja aire a la derecha.'],
  ['op-rect', '3 · Rectángulo suave', 'El mismo lima con el redondeo de las filas de menú del manual, en vez de píldora.'],
  ['op-anillo', '4 · Anillo interior', 'El lima con una línea fina verde oscura por dentro, como un sello.'],
  ['op-foco', '5 · Foco', 'Lo elegido en lima y lo demás un poco más apagado; al pasar el mouse todo vuelve.'],
  ['op-desliza', '6 · Se desliza', 'La píldora viaja de la sección anterior a la nueva, incluso hacia adentro de Guías.'],
];
const flecha = '<svg class="ch-menu-flecha" aria-hidden="true"><use href="#i-flecha"/></svg>';
const arbol = [
  {id:'favoritos', nombre:'Mis favoritos', icono:'i-estrella'},
  {id:'nuevo', nombre:'Nuevo', icono:'i-nuevo'},
  {id:'guias', nombre:'Guías de práctica clínica', icono:'i-guias', hijos:[
    {id:'resumenes', nombre:'Resúmenes individuales'},
    {id:'contrastadas', nombre:'Guías contrastadas'},
    {id:'herramientas', nombre:'Herramientas interactivas'},
    {id:'videos', nombre:'Videos de procedimientos'},
  ]},
  {id:'news', nombre:'Clinical News', icono:'i-news'},
  {id:'autoevaluacion', nombre:'Autoevaluación', icono:'i-autoevaluacion'},
  {id:'ia', nombre:'Entrenamiento en IA', icono:'i-ia'},
];
const items = (lista, nivel) => lista.map(s => `
  <li${s.hijos ? ' class="ch-menu-grupo"' : ''}>
    <button type="button" class="ch-menu-item${nivel ? ' sub' : ''}" data-id="${s.id}"${s.hijos ? ' aria-expanded="false"' : ''}>${s.icono ? `<svg aria-hidden="true"><use href="#${s.icono}"/></svg>` : ''}<span class="ch-menu-nombre">${s.nombre}</span>${s.hijos ? flecha : ''}</button>
    ${s.hijos ? `<ul class="ch-menu-rama">${items(s.hijos, nivel + 1)}</ul>` : ''}
  </li>`).join('');

document.getElementById('opciones').innerHTML = opciones.map(([clase, nombre, nota]) => `
  <section class="ch-opcion ${clase}">
    <p class="ch-opcion-nombre">${nombre}</p>
    <p class="ch-opcion-nota">${nota}</p>
    <nav class="ch-menu" aria-label="${nombre}"><ul class="ch-menu-lista">${items(arbol, 0)}</ul></nav>
  </section>`).join('');

// Igual que el panel: clic en un grupo cerrado lo abre y lo elige;
// clic en un grupo abierto lo cierra sin cambiar de sección.
document.querySelectorAll('.ch-opcion .ch-menu').forEach(nav => {
  const cerrados = new Set();
  const abrir = () => {
    const actual = nav.querySelector('[aria-current]');
    nav.querySelectorAll('.ch-menu-grupo').forEach(g => {
      const b = g.querySelector(':scope > button');
      const abierta = g.contains(actual) && !cerrados.has(b.dataset.id);
      g.classList.toggle('abierto', abierta);
      b.setAttribute('aria-expanded', abierta);
    });
  };
  const elegir = id => {
    cerrados.clear();
    nav.querySelectorAll('.ch-menu-item').forEach(b => b.dataset.id === id ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
    abrir();
  };
  nav.addEventListener('click', e => {
    const b = e.target.closest('.ch-menu-item');
    if (!b) return;
    const grupo = b.parentElement.classList.contains('ch-menu-grupo');
    if (grupo && b.getAttribute('aria-expanded') === 'true') { cerrados.add(b.dataset.id); abrir(); }
    else if (grupo && b.hasAttribute('aria-current')) { cerrados.delete(b.dataset.id); abrir(); }
    else elegir(b.dataset.id);
  });
  elegir('resumenes');
});

// Opción 6: una sola píldora que se mide sobre lo elegido y viaja hasta ahí.
document.querySelectorAll('.op-desliza .ch-menu').forEach(nav => {
  const lista = nav.querySelector('.ch-menu-lista');
  const pildora = document.createElement('span');
  pildora.className = 'ch-desliza';
  pildora.setAttribute('aria-hidden', 'true');
  lista.prepend(pildora);
  const medir = () => {
    const b = nav.querySelector('[aria-current]');
    if (!b) return;
    const caja = lista.getBoundingClientRect(), r = b.getBoundingClientRect();
    pildora.style.setProperty('--y', (r.top - caja.top) + 'px');
    pildora.style.setProperty('--w', r.width + 'px');
    pildora.style.setProperty('--h', r.height + 'px');
  };
  // Se vuelve a medir mientras la rama se abre o se cierra
  nav.addEventListener('click', () => { const fin = performance.now() + 400; (function paso(){ medir(); if (performance.now() < fin) requestAnimationFrame(paso); })(); });
  document.fonts.ready.then(() => { medir(); requestAnimationFrame(() => pildora.classList.add('lista')); });
});
</script>
</body>
</html>
